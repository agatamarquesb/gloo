services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
      PORT: 3001
      UPLOADS_DIR: /app/uploads
      # Google Calendar. Blank-defaulted so the stack still boots without them —
      # the connect route answers 503 and the rest of the calendar is unaffected.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/calendar/google/callback}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      # tsx watch (chokidar) misses edits made on the host, because Docker
      # Desktop's bind mounts don't deliver inotify events reliably on macOS —
      # so new routes would 404 until the container was restarted by hand.
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3001:3001'
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/shared:/app/packages/shared
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - api_node_modules:/app/packages/api/node_modules
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:5173'
    volumes:
      - ./packages/web:/app/packages/web
      - ./packages/shared:/app/packages/shared
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - web_node_modules:/app/packages/web/node_modules

volumes:
  db_data:
  uploads_data:
  api_node_modules:
  web_node_modules:
